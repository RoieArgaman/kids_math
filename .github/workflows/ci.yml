name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # Align with deploy.sh / local: predictable path for actions/cache + playwright install
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

jobs:
  # Change detection (~3s). Sets docs_only=true when the diff touches ONLY non-code files,
  # which skips the expensive lint/unit/e2e jobs below. The secret scan deliberately does
  # NOT depend on this — it always runs (see security-scan).
  #
  # Implemented as a plain GitHub-API + regex check rather than a glob-filter action: we
  # need "EVERY changed file is a doc" (docs-only), and path-filter actions answer the
  # different question "did ANY file match?" — the composition is easy to get subtly wrong.
  # Here the logic is explicit and fails SAFE: any file that is NOT recognized as a doc
  # (including a brand-new top-level path) makes docs_only=false and runs the full suite.
  #
  # Non-code = Markdown anywhere (`*.md`), or under `docs/`, `roadmap/`, `.claude/` (the whole
  # agent/tooling tree: rules, docs, commands, plans, settings.json, launch.json), or the
  # top-level `LICENSE`. Nothing CI runs compiles, imports, or exercises these, so the suite
  # can't validate them.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - name: Detect docs-only diff
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" -q '.[].filename')"
          else
            files="$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" -q '.files[].filename')"
          fi
          echo "Changed files:"; printf '%s\n' "$files"
          # A path is "non-code" if it is Markdown anywhere, under docs/ roadmap/ .claude/,
          # or the top-level LICENSE. Anything else counts as code → run the full suite.
          non_doc="$(printf '%s\n' "$files" | grep -vE '(\.md$|^docs/|^roadmap/|^\.claude/|^LICENSE$)' || true)"
          if [ -n "$files" ] && [ -z "$non_doc" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "→ docs-only diff: lint-and-unit and e2e will be skipped (secret scan still runs)."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "→ code present (or empty diff): full suite runs."
            [ -n "$non_doc" ] && { echo "Non-doc files:"; printf '%s\n' "$non_doc"; } || true
          fi

  # Fast gate: lint + testid coverage + unit tests (~45s). Runs in parallel with the
  # e2e shards below, so a lint/unit failure surfaces without waiting on the browser suite.
  # Skipped on docs-only changes.
  lint-and-unit:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check data-testid coverage
        run: npm run check:testids

      # Every app route must have a row in docs/TEST_COVERAGE_MATRIX.md. Advisory for now
      # (continue-on-error) while the matrix backfills — mirrors the `npm audit` phasing
      # below; drop continue-on-error to make an undocumented route fail the build.
      - name: Check coverage matrix
        continue-on-error: true
        run: npm run check:coverage-matrix

      - name: Unit tests (with coverage thresholds)
        run: npm run test:coverage

  # Content-accuracy advisory (roadmap finding F5). Runs the AI pedagogy audit on the
  # learner-content files a PR CHANGED, so new/edited days always get an automatic pass
  # (the deterministic validator can't judge word-problem semantics, distractor plausibility,
  # or MoE syllabus fit). WARN-LEVEL: job-level `continue-on-error` makes a finding — or an
  # API hiccup — neutral, never a failure, so it can't fail `workflow_run.conclusion` and
  # therefore can't block deploy.yml. The script is also fail-open: it exits 0 when there's no
  # PR base, no ANTHROPIC_API_KEY (local runs and fork PRs, which can't see repo secrets), or
  # no changed content. Mirrors the check:coverage-matrix advisory. Skipped on docs-only diffs.
  content-accuracy:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the three-dot `origin/<base>...HEAD` merge-base diff resolves.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Content-accuracy audit (advisory, changed content only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Cheaper model for the per-PR bulk pass; the human CLI keeps its Opus default.
          AUDIT_MODEL: claude-haiku-4-5
        run: npm run check:content

  # Supply-chain / secret scanning (roadmap S6 / Phase 0.5). Runs in parallel with the
  # other jobs. `npm audit` starts non-blocking (continue-on-error) so a newly-disclosed
  # advisory doesn't wedge unrelated PRs; flip to blocking once the tree is clean. The
  # secret scan is blocking — a committed credential must fail the build.
  # NOTE: intentionally has no `needs: changes` / `if:` gate — it ALWAYS runs, even on
  # docs-only diffs, so a secret can never slip in through a Markdown-only change. Keeping
  # it inside the CI workflow is also what lets it keep gating deploy.yml (workflow_run).
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the secret scan can inspect all commits on the branch/PR.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Dependency audit (high+)
        # Non-blocking first; remove continue-on-error to enforce once the tree is clean.
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action is free for personal repos. If this repo ever moves under a
          # GitHub ORG, set GITLEAKS_LICENSE (repo secret) or the step fails closed and,
          # because deploy.yml gates on full CI success, would block all deploys.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # Fast-fail smoke lane: runs the `@smoke`-tagged happy-path E2E tests un-sharded (~1-2 min).
  # The full sharded `e2e` job gates on this (`needs: e2e-smoke`), so a broadly-broken PR
  # fails here in ~90s and the 8 shard builds never spin up — cheap failure on the common
  # "obviously broken" push, at the cost of ~90s added to the front of a green run.
  e2e-smoke:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache Next.js compiler cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'next.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: .playwright-browsers
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (@smoke tag)
        run: npm run test:e2e:smoke

  # E2E, split across 8 parallel shards. Each shard is self-contained (builds its own
  # production server) so the shards run fully in parallel — parallel builds cost the
  # same wall-clock as one, and the shared .next/cache keeps them incremental. This is
  # faster end-to-end than a single shared build that would serialize build -> e2e.
  # Gated on e2e-smoke so a broadly-broken PR never spins these up. Skipped on docs-only.
  e2e:
    needs: [changes, e2e-smoke]
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    # Fail fast on a hung shard: without this the job inherits GitHub's 6h default, so a
    # crashed browser (see the CI-only worker cap in playwright.config.ts) would sit for
    # hours burning per-test timeouts instead of surfacing quickly.
    timeout-minutes: 20
    strategy:
      # One failing shard should not cancel the others — we want the full failure picture.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache Next.js compiler cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'next.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: .playwright-browsers
          # Strict key: invalidates when lockfile (incl. @playwright/test) changes — no broad restore-keys
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (shard ${{ matrix.shard }}/8)
        run: npx playwright test --shard=${{ matrix.shard }}/8
